# Local environment: MySQL, Kafka (single KRaft broker) and the three services.
#   cp .env.example .env     (then change the passwords)
#   docker compose up -d --build
# Host ports are bound to 127.0.0.1 only. Host Kafka clients use localhost:19092, containers use kafka:9092.

name: content-review

x-app: &app
  restart: unless-stopped
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      CASE_DB_USER: ${CASE_DB_USER:-case_user}
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD:?set CASE_DB_PASSWORD in .env}
      REVIEW_DB_USER: ${REVIEW_DB_USER:-review_user}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD in .env}
      CONTENT_DB_USER: ${CONTENT_DB_USER:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?set CONTENT_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  content-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: {SERVICE: content-service, PORT: "8083"}
    image: content-review/content-service:local
    depends_on:
      mysql: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      CONTENT_DB_URL: jdbc:mysql://mysql:3306/content_db
      CONTENT_DB_USER: ${CONTENT_DB_USER:-content_user}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?set CONTENT_DB_PASSWORD in .env}
      DEMO_REPORTER_PASSWORD: ${DEMO_REPORTER_PASSWORD:?set DEMO_REPORTER_PASSWORD in .env}
      DEMO_CREATOR_PASSWORD: ${DEMO_CREATOR_PASSWORD:?set DEMO_CREATOR_PASSWORD in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  review-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: {SERVICE: review-service, PORT: "8082"}
    image: content-review/review-service:local
    depends_on:
      mysql: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      content-service: {condition: service_healthy}
    environment:
      <<: *app-env
      REVIEW_DB_URL: jdbc:mysql://mysql:3306/review_db
      REVIEW_DB_USER: ${REVIEW_DB_USER:-review_user}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD in .env}
      CONTENT_SERVICE_GRPC_TARGET: content-service:9090
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  case-service:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args: {SERVICE: case-service, PORT: "8081"}
    image: content-review/case-service:local
    depends_on:
      mysql: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      content-service: {condition: service_healthy}
    environment:
      <<: *app-env
      CASE_DB_URL: jdbc:mysql://mysql:3306/case_db
      CASE_DB_USER: ${CASE_DB_USER:-case_user}
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD:?set CASE_DB_PASSWORD in .env}
      CONTENT_SERVICE_GRPC_TARGET: content-service:9090
      DEMO_REPORTER_PASSWORD: ${DEMO_REPORTER_PASSWORD:?set DEMO_REPORTER_PASSWORD in .env}
      DEMO_CREATOR_PASSWORD: ${DEMO_CREATOR_PASSWORD:?set DEMO_CREATOR_PASSWORD in .env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql-data:
  kafka-data:

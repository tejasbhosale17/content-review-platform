apiVersion: v1
kind: Service
metadata:
  name: case-service
  namespace: content-review
spec:
  selector: {app: case-service}
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-service
  namespace: content-review
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: case-service}
  template:
    metadata:
      labels: {app: case-service}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: case-service
          image: content-review/case-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - {name: CASE_DB_USER, valueFrom: {secretKeyRef: {name: app-secrets, key: CASE_DB_USER}}}
            - {name: CASE_DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: CASE_DB_PASSWORD}}}
            - {name: DEMO_REPORTER_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: DEMO_REPORTER_PASSWORD}}}
            - {name: DEMO_CREATOR_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: DEMO_CREATOR_PASSWORD}}}
            - {name: DEMO_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: DEMO_ADMIN_PASSWORD}}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}

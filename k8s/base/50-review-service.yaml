apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: content-review
spec:
  selector: {app: review-service}
  ports:
    - {name: http, port: 8082, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: content-review
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: review-service}
  template:
    metadata:
      labels: {app: review-service}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: review-service
          image: content-review/review-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - {name: REVIEW_DB_USER, valueFrom: {secretKeyRef: {name: app-secrets, key: REVIEW_DB_USER}}}
            - {name: REVIEW_DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: REVIEW_DB_PASSWORD}}}
            - {name: DEMO_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: DEMO_ADMIN_PASSWORD}}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: content-review
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - {name: mysql, port: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: content-review
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.4.13
          ports:
            - {name: mysql, containerPort: 3306}
          env:
            - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: MYSQL_ROOT_PASSWORD}}}
            - {name: CASE_DB_USER, valueFrom: {secretKeyRef: {name: app-secrets, key: CASE_DB_USER}}}
            - {name: CASE_DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: CASE_DB_PASSWORD}}}
            - {name: REVIEW_DB_USER, valueFrom: {secretKeyRef: {name: app-secrets, key: REVIEW_DB_USER}}}
            - {name: REVIEW_DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: REVIEW_DB_PASSWORD}}}
            - {name: CONTENT_DB_USER, valueFrom: {secretKeyRef: {name: app-secrets, key: CONTENT_DB_USER}}}
            - {name: CONTENT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: CONTENT_DB_PASSWORD}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: init
          configMap:
            name: mysql-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}

spring:
  application:
    name: case-service
  datasource:
    url: ${CASE_DB_URL:jdbc:mysql://localhost:3306/case_db}
    username: ${CASE_DB_USER:case_user}
    password: ${CASE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: 8081
content-service:
  base-url: ${CONTENT_SERVICE_BASE_URL:http://localhost:8083}
  connect-timeout: 1s
  read-timeout: 2s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

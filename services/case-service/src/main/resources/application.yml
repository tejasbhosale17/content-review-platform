spring:
  application:
    name: case-service
  datasource:
    url: ${CASE_DB_URL:jdbc:mysql://localhost:3306/case_db}
    username: ${CASE_DB_USER:case_user}
    password: ${CASE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: case-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
server:
  port: 8081
content-service:
  base-url: ${CONTENT_SERVICE_BASE_URL:http://localhost:8083}
  connect-timeout: 1s
  read-timeout: 2s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

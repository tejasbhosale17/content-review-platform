spring:
  application:
    name: content-service
  datasource:
    url: ${CONTENT_DB_URL:jdbc:mysql://localhost:3306/content_db}
    username: ${CONTENT_DB_USER:content_user}
    password: ${CONTENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: content-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
server:
  port: 8083
grpc:
  server:
    port: ${GRPC_PORT:9090}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      service: content-service
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: content-service
app:
  security:
    users:
      - username: reporter
        password: ${DEMO_REPORTER_PASSWORD}
        roles: [REPORTER]
      - username: creator
        password: ${DEMO_CREATOR_PASSWORD}
        roles: [CREATOR]
      - username: admin
        password: ${DEMO_ADMIN_PASSWORD}
        roles: [ADMIN]

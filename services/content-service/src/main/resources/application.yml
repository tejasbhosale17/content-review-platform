spring:
  application:
    name: content-service
  datasource:
    url: ${CONTENT_DB_URL:jdbc:mysql://localhost:3306/content_db}
    username: ${CONTENT_DB_USER:content_user}
    password: ${CONTENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: content-projection
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
